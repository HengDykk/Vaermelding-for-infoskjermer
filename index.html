<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vær Stavanger</title>
  <meta http-equiv="refresh" content="21600">
  <script>
    (function (window, document) {
      var nav = window.navigator || {};
      var ua = String(nav.userAgent || "");
      var css = window.CSS;
      var canTestCss = !!(css && css.supports);
      var hasGrid = canTestCss && css.supports("display", "grid");
      var hasClamp = canTestCss && css.supports("width", "clamp(10px, 2vw, 20px)");
      var hasFilter = canTestCss && (css.supports("filter", "blur(1px)") || css.supports("-webkit-filter", "blur(1px)"));
      var hasBasicJs = !!(document.getElementById && window.JSON && window.Date && Array.prototype.forEach);
      var hasFetchStack = !!(window.fetch && window.Promise);
      var isSamsungSignage = /Tizen|SMART-TV|Maple|SamsungBrowser|Samsung/i.test(ua);
      var query = String(window.location.search || "").toLowerCase();
      var mode = "modern";

      if (!hasBasicJs || (!hasFetchStack && !window.XMLHttpRequest)) {
        mode = "legacy";
      } else if (!hasGrid || !hasClamp) {
        mode = isSamsungSignage ? "legacy" : "reduced";
      } else if (!hasFetchStack || !hasFilter || isSamsungSignage) {
        mode = "reduced";
      }

      if (query.indexOf("mode=legacy") !== -1) mode = "legacy";
      if (query.indexOf("mode=reduced") !== -1) mode = "reduced";
      if (query.indexOf("mode=modern") !== -1) mode = "modern";

      window.SIGNAGE_MODE = mode;
      document.documentElement.className += " compat-" + mode;
    })(window, document);
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: rgba(10, 17, 26, 0.96);
      --ink-soft: rgba(10, 17, 26, 0.74);
      --ink-faint: rgba(10, 17, 26, 0.52);
      --panel: rgba(255, 255, 255, 0.18);
      --panel-strong: rgba(255, 255, 255, 0.30);
      --line: rgba(10, 17, 26, 0.14);
      --shine: rgba(255, 255, 255, 0.58);
      --bg-filter: saturate(0.98) contrast(1.06) brightness(1.08);
      --overlay:
        linear-gradient(90deg, rgba(245,248,252,0.64), rgba(245,248,252,0.20) 43%, rgba(245,248,252,0.42)),
        linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.06) 50%, rgba(238,244,250,0.50));
    }
    body[data-theme="night"] {
      color-scheme: dark;
      --ink: rgba(246, 249, 255, 0.96);
      --ink-soft: rgba(232, 239, 249, 0.78);
      --ink-faint: rgba(232, 239, 249, 0.58);
      --panel: rgba(6, 12, 22, 0.30);
      --panel-strong: rgba(8, 15, 28, 0.46);
      --line: rgba(255, 255, 255, 0.18);
      --shine: rgba(255, 255, 255, 0.12);
      --bg-filter: saturate(1.08) contrast(1.12) brightness(0.72);
      --overlay:
        linear-gradient(90deg, rgba(4,8,16,0.28), rgba(4,8,16,0.08) 45%, rgba(4,8,16,0.34)),
        linear-gradient(180deg, rgba(2,6,14,0.10), rgba(2,6,14,0.18) 48%, rgba(2,6,14,0.46));
    }
    * { box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #03070d;
    }
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background: #03070d;
      user-select: none;
      cursor: none;
      text-rendering: geometricPrecision;
    }
    .bg {
      position: fixed;
      inset: 0;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #c9dced center/cover no-repeat;
      filter: var(--bg-filter);
      transform: scale(1.015);
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: var(--overlay);
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(26px, 4vw, 58px) clamp(34px, 5vw, 82px) clamp(26px, 4vw, 48px);
      gap: clamp(18px, 3vh, 40px);
    }
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      min-height: 74px;
    }
    .city {
      font-size: clamp(30px, 4.1vw, 58px);
      font-weight: 950;
      line-height: 0.94;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 1px 0 var(--shine), 0 18px 52px rgba(0,0,0,0.12);
    }
    .dateLine {
      margin-top: 9px;
      font-size: clamp(16px, 1.75vw, 23px);
      font-weight: 700;
      color: var(--ink-soft);
    }
    .topClock {
      font-size: clamp(28px, 3.8vw, 58px);
      font-weight: 950;
      line-height: 0.95;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      text-align: right;
      text-shadow: 0 1px 0 var(--shine), 0 18px 52px rgba(0,0,0,0.12);
      white-space: nowrap;
    }
    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.43fr);
      align-items: center;
      gap: clamp(28px, 5vw, 86px);
      min-height: 0;
    }
    .now {
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 3vw, 40px);
      min-width: 0;
    }
    .mainIcon {
      width: clamp(118px, 17vw, 220px);
      height: clamp(118px, 17vw, 220px);
      object-fit: contain;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,0.42)) drop-shadow(0 22px 38px rgba(255,255,255,0.18));
    }
    .tempBlock {
      display: grid;
      justify-items: start;
      min-width: 0;
    }
    .tempLine {
      display: flex;
      align-items: flex-start;
      font-size: clamp(112px, 19.4vw, 268px);
      font-weight: 950;
      line-height: 0.78;
      letter-spacing: 0;
      text-shadow: 0 1px 0 var(--shine), 0 24px 58px rgba(0,0,0,0.14);
    }
    .degree {
      font-size: 0.34em;
      line-height: 1;
      margin-left: 8px;
      margin-top: 0.08em;
    }
    .desc {
      margin-top: clamp(10px, 1.2vw, 18px);
      width: 100%;
      text-align: center;
      font-size: clamp(18px, 2.15vw, 30px);
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }
    .feelsLine {
      margin-top: 7px;
      width: 100%;
      text-align: center;
      color: var(--ink-soft);
      font-size: clamp(15px, 1.55vw, 22px);
      font-weight: 800;
      text-transform: uppercase;
    }
    .stats {
      display: grid;
      gap: clamp(8px, 1.05vw, 14px);
      align-self: center;
      justify-self: start;
      width: min(410px, 100%);
      padding: clamp(16px, 2.2vw, 28px);
      border: 1px solid rgba(255,255,255,0.28);
      background: linear-gradient(145deg, var(--panel-strong), rgba(255,255,255,0.08));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255,255,255,0.20);
    }
    .stat {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 22px;
      padding-bottom: clamp(8px, 1vw, 12px);
      border-bottom: 1px solid var(--line);
      font-size: clamp(16px, 1.55vw, 22px);
      font-weight: 900;
      text-transform: uppercase;
    }
    .stat:last-of-type { border-bottom: 0; padding-bottom: 0; }
    .label {
      color: var(--ink);
      white-space: nowrap;
    }
    .value {
      text-align: right;
      font-weight: 900;
      text-transform: none;
      white-space: nowrap;
    }
    .windValue {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }
    .pollenValue {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .windArrow {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      font-size: 23px;
      line-height: 1;
      transform-origin: 50% 50%;
    }
    .sun {
      margin-top: clamp(8px, 1.2vw, 16px);
      padding-top: clamp(10px, 1.3vw, 16px);
      border-top: 2px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--ink-soft);
      font-size: clamp(13px, 1.15vw, 16px);
      font-weight: 800;
      text-transform: uppercase;
    }
    .forecast {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid rgba(10,17,26,0.18);
      border-bottom: 1px solid rgba(255,255,255,0.34);
      background: linear-gradient(90deg, var(--panel), rgba(255,255,255,0.05));
      box-shadow: 0 -18px 70px rgba(0,0,0,0.08);
    }
    .day {
      min-height: clamp(112px, 15vh, 174px);
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: 1fr auto;
      align-items: center;
      justify-content: center;
      column-gap: clamp(10px, 1.4vw, 20px);
      padding: clamp(14px, 2vw, 26px) clamp(12px, 2vw, 24px);
      border-left: 1px solid rgba(10,17,26,0.13);
    }
    .day:first-child { border-left: 0; }
    .dayIcon {
      width: clamp(34px, 5vw, 64px);
      height: clamp(34px, 5vw, 64px);
      object-fit: contain;
      justify-self: end;
    }
    .dayTemp {
      font-size: clamp(42px, 6vw, 82px);
      font-weight: 950;
      line-height: 0.9;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .dayTemp sup {
      font-size: 0.42em;
      top: -0.65em;
      position: relative;
    }
    .dayName {
      grid-column: 1 / -1;
      justify-self: center;
      margin-top: clamp(4px, 1vw, 10px);
      font-size: clamp(15px, 1.7vw, 23px);
      font-weight: 950;
      text-transform: uppercase;
      text-align: center;
    }
    .loading, .err {
      grid-column: 1 / -1;
      text-align: center;
      font-weight: 800;
      color: var(--ink);
    }
    .err {
      position: fixed;
      left: 30px;
      right: 30px;
      bottom: 14px;
      color: #6f1d1d;
      font-size: 14px;
      white-space: pre-wrap;
    }
    @media (max-width: 920px) {
      .main { grid-template-columns: 1fr; gap: 20px; }
      .stats { width: 100%; justify-self: stretch; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; cursor: auto; }
      .stage { min-height: 100%; height: auto; padding: 22px; gap: 22px; }
      .topbar { min-height: auto; }
      .now { grid-template-columns: auto 1fr; justify-content: start; }
      .mainIcon { width: 82px; height: 82px; }
      .tempLine { font-size: 104px; }
      .desc, .feelsLine { text-align: left; }
      .desc { font-size: 18px; }
      .feelsLine { font-size: 14px; }
      .stats { padding: 16px; }
      .stat { font-size: 15px; gap: 12px; }
      .topClock { font-size: 28px; }
      .forecast { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .day:nth-child(odd) { border-left: 0; }
    }
    .compat-reduced .bg,
    .compat-legacy .bg {
      filter: none;
      transform: none;
    }
    .compat-legacy .bg {
      background-color: #07111e;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }
    .compat-legacy .bg::after {
      display: block;
      background: rgba(3, 8, 16, 0.28);
    }
    .compat-reduced .mainIcon,
    .compat-legacy .mainIcon {
      filter: none;
    }
    .compat-reduced .city,
    .compat-reduced .topClock,
    .compat-reduced .tempLine,
    .compat-legacy .city,
    .compat-legacy .topClock,
    .compat-legacy .tempLine {
      text-shadow: none;
    }
    .compat-reduced .stats,
    .compat-reduced .forecast {
      box-shadow: none;
      background: rgba(255,255,255,0.34);
    }
    .compat-legacy .stats,
    .compat-legacy .forecast {
      box-shadow: none;
      background: rgba(6,12,22,0.46);
    }
    .compat-reduced *,
    .compat-legacy * {
      transition: none !important;
      animation: none !important;
    }
    .compat-legacy .stage {
      display: block;
      width: 1920px;
      height: 1080px;
      padding: 48px 72px 36px;
      color: #f3f6fb;
      font-family: Arial, Helvetica, sans-serif;
    }
    .compat-legacy body[data-theme="day"] .stage {
      color: #07111e;
    }
    .compat-legacy .topbar {
      display: block;
      min-height: 105px;
    }
    .compat-legacy .topbar > div:first-child {
      float: left;
    }
    .compat-legacy .topClock {
      float: right;
      font-size: 66px;
    }
    .compat-legacy .city {
      font-size: 66px;
    }
    .compat-legacy .dateLine {
      font-size: 25px;
    }
    .compat-legacy .main {
      clear: both;
      display: block;
      position: relative;
      width: 100%;
      height: 700px;
    }
    .compat-legacy .main > div {
      position: absolute;
      left: 300px;
      top: 205px;
      width: 870px;
    }
    .compat-legacy .now {
      display: block;
      text-align: center;
    }
    .compat-legacy .mainIcon {
      display: inline-block;
      width: 190px;
      height: 190px;
      vertical-align: middle;
      margin-right: 40px;
    }
    .compat-legacy .tempBlock {
      display: inline-block;
      vertical-align: middle;
    }
    .compat-legacy .tempLine {
      display: block;
      font-size: 268px;
    }
    .compat-legacy .desc {
      font-size: 34px;
    }
    .compat-legacy .feelsLine {
      font-size: 24px;
    }
    .compat-legacy .stats {
      display: block;
      position: absolute;
      right: 135px;
      top: 176px;
      width: 450px;
      padding: 26px 30px;
      border: 1px solid rgba(170,185,205,0.38);
      background: rgba(6,12,22,0.42);
    }
    .compat-legacy .stat {
      display: block;
      overflow: hidden;
      font-size: 24px;
      padding: 0 0 13px;
      margin-bottom: 13px;
      border-bottom: 1px solid rgba(180,195,215,0.28);
    }
    .compat-legacy .label {
      float: left;
    }
    .compat-legacy .value {
      float: right;
    }
    .compat-legacy .pollenValue,
    .compat-legacy .sun,
    .compat-legacy .pollenStat {
      display: none !important;
    }
    .compat-legacy .forecast {
      display: table;
      position: absolute;
      left: 72px;
      bottom: 36px;
      width: 100%;
      width: 1776px;
      table-layout: fixed;
      margin-top: 0;
      border-top: 1px solid rgba(180,195,215,0.28);
      border-bottom: 1px solid rgba(180,195,215,0.28);
      background: rgba(6,12,22,0.42);
    }
    .compat-legacy .day {
      display: table-cell;
      width: 25%;
      min-height: 0;
      height: 164px;
      padding: 24px;
      text-align: center;
      border-left: 1px solid rgba(180,195,215,0.20);
    }
    .compat-legacy .day:first-child {
      border-left: 0;
    }
    .compat-legacy .dayIcon {
      width: 64px;
      height: 64px;
      vertical-align: middle;
      margin-right: 18px;
    }
    .compat-legacy .dayTemp {
      display: inline-block;
      font-size: 82px;
      vertical-align: middle;
    }
    .compat-legacy .dayName {
      display: block;
      font-size: 24px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <main class="stage">
    <header class="topbar">
      <div>
        <div class="city">Stavanger</div>
        <div class="dateLine" id="dateLine">Laster dato</div>
      </div>
      <div class="topClock" id="clock">--:--:--</div>
    </header>

    <section class="main" aria-label="Vær nå">
      <div>
        <div class="now">
          <img class="mainIcon" id="mainIcon" alt="" decoding="async" fetchpriority="high" />
          <div class="tempBlock">
            <div class="tempLine"><span id="temp">-</span><span class="degree">°</span></div>
            <div class="desc" id="desc">Henter data</div>
            <div class="feelsLine">Føles som <span id="feels">-</span>°</div>
          </div>
        </div>
      </div>

      <aside class="stats" aria-label="Detaljer">
        <div class="stat"><span class="label">Vind</span><span class="value windValue"><span id="windDir">-</span><span class="windArrow" id="windArrow">↑</span><span><span id="wind">-</span> m/s</span></span></div>
        <div class="stat"><span class="label">Vindkast</span><span class="value"><span id="gust">-</span> m/s</span></div>
        <div class="stat"><span class="label">Regn</span><span class="value"><span id="rain">-</span> mm</span></div>
        <div class="stat"><span class="label">Luftfuktighet</span><span class="value"><span id="humidity">-</span>%</span></div>
        <div class="stat pollenStat"><span class="label">Pollen</span><span class="value pollenValue" id="pollen" title="Henter pollenvarsel">Henter</span></div>
        <div class="sun" id="sunrow" style="display:none">
          <span>Sol opp <span id="sunrise">--:--</span></span>
          <span>Sol ned <span id="sunset">--:--</span></span>
        </div>
      </aside>
    </section>

    <section class="forecast" id="forecast" aria-label="Kommende dager">
      <div class="loading">Henter prognose</div>
    </section>
  </main>
  <div class="err" id="err"></div>

  <script>
    (function () {
      var WORKER = "https://vaer-stavanger.arild-dahl-andersen.workers.dev";
      var LAT = "58.969975";
      var LON = "5.733107";
      var TIMEZONE = "Europe/Oslo";
      var MODE = window.SIGNAGE_MODE || "modern";
      var WEATHER_INTERVAL = MODE === "legacy" ? 15 * 60 * 1000 : 10 * 60 * 1000;
      var CLOCK_INTERVAL = MODE === "legacy" ? 60 * 1000 : 1000;
      var BG_MAP = {
        clear: "images/clear.jpg",
        clear_night: "images/clear_night.jpg",
        clear_polartwilight: "images/clear_night.jpg",
        partlycloudy: "images/partlycloudy.jpg",
        partlycloudy_night: "images/partlycloudy_night.jpg",
        partlycloudy_polartwilight: "images/partlycloudy_night.jpg",
        cloudy: "images/cloudy.jpg",
        cloudy_night: "images/cloudy_night.jpg",
        cloudy_polartwilight: "images/cloudy_night.jpg",
        rain: "images/rain.jpg",
        rain_night: "images/rain_night.jpg",
        rain_polartwilight: "images/rain_night.jpg",
        snow: "images/snow.jpg",
        snow_night: "images/snow_night.jpg",
        snow_polartwilight: "images/snow_night.jpg",
        fog: "images/fog.jpg",
        fog_night: "images/fog_night.jpg",
        fog_polartwilight: "images/fog_night.jpg"
      };
      var ICON_BASE = "https://raw.githubusercontent.com/metno/weathericons/main/weather/svg";
      var TEXT = {
        clearsky: "Klarvær",
        fair: "Lettskyet",
        partlycloudy: "Delvis skyet",
        cloudy: "Skyet",
        fog: "Tåke",
        rain: "Regn",
        heavyrain: "Kraftig regn",
        lightrain: "Lett regn",
        rainshowers: "Regnbyger",
        heavyrainshowers: "Kraftige regnbyger",
        lightrainshowers: "Lette regnbyger",
        sleet: "Sludd",
        heavysleet: "Kraftig sludd",
        lightsleet: "Lett sludd",
        sleetshowers: "Sluddbyger",
        snow: "Snø",
        heavysnow: "Kraftig snø",
        lightsnow: "Lett snø",
        snowshowers: "Snøbyger",
        thunderstorms: "Tordenvær",
        rainandthunder: "Regn og torden",
        snowandthunder: "Snø og torden"
      };
      var WEEKDAYS = ["SØNDAG", "MANDAG", "TIRSDAG", "ONSDAG", "TORSDAG", "FREDAG", "LØRDAG"];
      var WEEKDAYS_TITLE = ["Søndag", "Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"];
      var MONTHS = ["januar", "februar", "mars", "april", "mai", "juni", "juli", "august", "september", "oktober", "november", "desember"];

      function el(id) {
        return document.getElementById(id);
      }

      function finite(value) {
        return typeof Number.isFinite === "function" ? Number.isFinite(value) : isFinite(value);
      }

      function read(object, path, fallback) {
        var current = object;
        var i;
        for (i = 0; i < path.length; i += 1) {
          if (current == null) return fallback;
          current = current[path[i]];
        }
        return current == null ? fallback : current;
      }

      function hasText(value, token) {
        return String(value || "").indexOf(token) !== -1;
      }

      function baseSymbol(code) {
        return String(code || "").replace(/_(day|night|polartwilight)$/, "");
      }

      function textFor(code) {
        var base = baseSymbol(code);
        var left;
        if (TEXT[base]) return TEXT[base];
        if (hasText(base, "andthunder")) {
          left = base.replace("andthunder", "");
          return TEXT[left] ? TEXT[left] + " og torden" : "Torden";
        }
        return "Ukjent";
      }

      function keyFromSymbol(code) {
        var c = String(code || "");
        if (hasText(c, "clearsky") || hasText(c, "fair")) return "clear";
        if (hasText(c, "partlycloudy")) return "partlycloudy";
        if (hasText(c, "cloudy")) return "cloudy";
        if (hasText(c, "fog")) return "fog";
        if (hasText(c, "snow") || hasText(c, "sleet")) return "snow";
        if (hasText(c, "rain") || hasText(c, "showers")) return "rain";
        return "cloudy";
      }

      function backgroundKeyFromSymbol(code) {
        var symbol = String(code || "");
        var base = keyFromSymbol(symbol);
        var suffix = hasText(symbol, "_night") ? "_night" : (hasText(symbol, "_polartwilight") ? "_polartwilight" : "");
        return BG_MAP[base + suffix] ? base + suffix : base;
      }

      function isNightSymbol(code) {
        var symbol = String(code || "");
        return hasText(symbol, "_night") || hasText(symbol, "_polartwilight");
      }

      function iconUrl(symbol) {
        var code = String(symbol || "cloudy").replace(/[^a-z0-9_]/gi, "");
        return ICON_BASE + "/" + (code || "cloudy") + ".svg";
      }

      function two(value) {
        return value < 10 ? "0" + value : String(value);
      }

      function intlFormat(date, options) {
        if (!window.Intl || !Intl.DateTimeFormat) return "";
        try {
          return new Intl.DateTimeFormat("no-NO", options).format(date);
        } catch (_) {
          return "";
        }
      }

      function looksEnglish(value) {
        return /monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|may|june|july|august|september|october|november|december/i.test(String(value || ""));
      }

      function formatTime(date, withSeconds) {
        var formatted = intlFormat(date, {
          timeZone: TIMEZONE,
          hour: "2-digit",
          minute: "2-digit",
          second: withSeconds ? "2-digit" : undefined,
          hour12: false
        });
        if (formatted) return formatted;
        return two(date.getHours()) + ":" + two(date.getMinutes()) + (withSeconds ? ":" + two(date.getSeconds()) : "");
      }

      function formatDateLine(date) {
        var weekday = intlFormat(date, { timeZone: TIMEZONE, weekday: "long" });
        var dayMonth = intlFormat(date, { timeZone: TIMEZONE, day: "numeric", month: "long" });
        if (MODE !== "legacy" && weekday && dayMonth && !looksEnglish(weekday + " " + dayMonth)) {
          return weekday.charAt(0).toUpperCase() + weekday.slice(1) + ", " + dayMonth;
        }
        return WEEKDAYS_TITLE[date.getDay()] + ", " + date.getDate() + ". " + MONTHS[date.getMonth()];
      }

      function localDateKey(date) {
        var formatted = window.Intl && Intl.DateTimeFormat ? new Intl.DateTimeFormat("en-CA", {
          timeZone: TIMEZONE,
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date) : "";
        if (formatted) return formatted;
        return date.getFullYear() + "-" + two(date.getMonth() + 1) + "-" + two(date.getDate());
      }

      function hourInOslo(date) {
        var formatted = window.Intl && Intl.DateTimeFormat ? new Intl.DateTimeFormat("en-US", {
          timeZone: TIMEZONE,
          hour: "numeric",
          hour12: false
        }).format(date) : "";
        return Number(formatted || date.getHours());
      }

      function dayName(date) {
        var formatted = intlFormat(date, { timeZone: TIMEZONE, weekday: "long" });
        return formatted && MODE !== "legacy" && !looksEnglish(formatted) ? formatted.toUpperCase() : WEEKDAYS[date.getDay()];
      }

      function fetchJson(url, done) {
        if (window.fetch && window.Promise) {
          fetch(url, { cache: "no-store" })
            .then(function (res) {
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.json();
            })
            .then(function (data) { done(null, data); })
            .catch(function (error) { done(error); });
          return;
        }

        if (!window.XMLHttpRequest) {
          done(new Error("Nettleseren kan ikke hente data"));
          return;
        }

        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status < 200 || xhr.status >= 300) {
              done(new Error("HTTP " + xhr.status));
              return;
            }
            try {
              done(null, JSON.parse(xhr.responseText));
            } catch (error) {
              done(error);
            }
          };
          xhr.send(null);
        } catch (error) {
          done(error);
        }
      }

      function pickSymbol(item) {
        return read(item, ["data", "next_1_hours", "summary", "symbol_code"], "") ||
          read(item, ["data", "next_6_hours", "summary", "symbol_code"], "") ||
          read(item, ["data", "next_12_hours", "summary", "symbol_code"], "");
      }

      function precip(item) {
        var oneHour = read(item, ["data", "next_1_hours", "details", "precipitation_amount"], null);
        var sixHours = read(item, ["data", "next_6_hours", "details", "precipitation_amount"], null);
        return oneHour == null ? (sixHours == null ? 0 : sixHours) : oneHour;
      }

      function windGust(details) {
        var value = read(details, ["wind_speed_of_gust"], null);
        if (value == null) value = read(details, ["wind_speed_of_gust_max"], null);
        if (value == null) value = read(details, ["wind_gust"], NaN);
        return Number(value);
      }

      function feelsLike(tempC, windMs) {
        var temp = Number(tempC);
        var wind = Number(windMs);
        var windKmh;
        if (!finite(temp)) return NaN;
        if (finite(wind) && temp <= 10 && wind > 1.34) {
          windKmh = wind * 3.6;
          return 13.12 + 0.6215 * temp - 11.37 * Math.pow(windKmh, 0.16) + 0.3965 * temp * Math.pow(windKmh, 0.16);
        }
        return temp;
      }

      function compassFromDegrees(degrees) {
        var deg = Number(degrees);
        var directions = ["N", "NØ", "Ø", "SØ", "S", "SV", "V", "NV"];
        if (!finite(deg)) return "-";
        return directions[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
      }

      function setText(id, value) {
        var node = el(id);
        if (node) node.textContent = value;
      }

      function updateClock() {
        var now = new Date();
        setText("clock", formatTime(now, MODE !== "legacy"));
        setText("dateLine", formatDateLine(now));
      }

      function buildDailyForecast(timeseries) {
        var today = localDateKey(new Date());
        var buckets = {};
        var order = [];
        var i;
        var item;
        var time;
        var key;
        var days = [];

        for (i = 0; i < timeseries.length; i += 1) {
          item = timeseries[i];
          time = new Date(item.time);
          key = localDateKey(time);
          if (key === today) continue;
          if (!buckets[key]) {
            buckets[key] = [];
            order.push(key);
          }
          buckets[key].push({ time: time, item: item });
        }

        for (i = 0; i < order.length && days.length < 4; i += 1) {
          var entries = buckets[order[i]];
          var best = entries[0];
          var j;
          for (j = 1; j < entries.length; j += 1) {
            if (Math.abs(hourInOslo(entries[j].time) - 13) < Math.abs(hourInOslo(best.time) - 13)) {
              best = entries[j];
            }
          }
          days.push({
            time: best.time,
            temp: Math.round(Number(read(best.item, ["data", "instant", "details", "air_temperature"], NaN))),
            symbol: pickSymbol(best.item)
          });
        }
        return days;
      }

      function renderForecast(days) {
        var root = el("forecast");
        var fallbackIcon = iconUrl("cloudy");
        var i;
        var day;
        var html = "";
        if (!root) return;
        for (i = 0; i < days.length; i += 1) {
          day = days[i];
          html += '<article class="day">' +
            '<img class="dayIcon" src="' + iconUrl(day.symbol) + '" alt="" loading="lazy" decoding="async" onerror="this.src=\'' + fallbackIcon + '\'">' +
            '<div class="dayTemp">' + (finite(day.temp) ? day.temp : "-") + '<sup>°</sup></div>' +
            '<div class="dayName">' + dayName(day.time) + '</div>' +
            '</article>';
        }
        root.innerHTML = html || '<div class="loading">Ingen prognose</div>';
      }

      function loadWeather(done) {
        setText("err", "");
        fetchJson(WORKER + "?lat=" + encodeURIComponent(LAT) + "&lon=" + encodeURIComponent(LON), function (error, data) {
          var timeseries;
          var nowItem;
          var details;
          var symbol;
          var temp;
          var wind;
          var gust;
          var windFrom;
          var humidity;
          var rain;
          var apparent;
          var mainIcon;
          var bg;
          if (error) {
            if (done) done(error);
            return;
          }
          timeseries = read(data, ["properties", "timeseries"], []);
          if (!timeseries || !timeseries.length) {
            if (done) done(new Error("Mangler timeseries"));
            return;
          }

          nowItem = timeseries[0];
          details = read(nowItem, ["data", "instant", "details"], {});
          symbol = pickSymbol(nowItem);
          temp = Math.round(Number(details.air_temperature));
          wind = Number(details.wind_speed);
          gust = windGust(details);
          windFrom = Number(details.wind_from_direction);
          humidity = Math.round(Number(details.relative_humidity));
          rain = precip(nowItem);
          apparent = Math.round(feelsLike(details.air_temperature, wind));

          setText("temp", finite(temp) ? temp : "-");
          setText("feels", finite(apparent) ? apparent : "-");
          setText("desc", textFor(symbol));
          setText("wind", finite(wind) ? wind.toFixed(1) : "-");
          setText("gust", finite(gust) ? gust.toFixed(1) : "-");
          setText("windDir", compassFromDegrees(windFrom));
          setText("rain", finite(Number(rain)) ? Number(rain).toFixed(1) : "-");
          setText("humidity", finite(humidity) ? humidity : "-");

          if (el("windArrow")) {
            el("windArrow").style.transform = finite(windFrom) ? "rotate(" + ((windFrom + 180) % 360) + "deg)" : "rotate(0deg)";
          }
          mainIcon = el("mainIcon");
          if (mainIcon) {
            mainIcon.src = iconUrl(symbol);
            mainIcon.onerror = function () { mainIcon.src = iconUrl("cloudy"); };
          }
          document.body.setAttribute("data-theme", isNightSymbol(symbol) ? "night" : "day");
          bg = el("bg");
          if (bg) bg.style.backgroundImage = "url('" + (BG_MAP[backgroundKeyFromSymbol(symbol)] || BG_MAP.cloudy) + "')";
          renderForecast(buildDailyForecast(timeseries));
          if (done) done(null);
        });
      }

      function loadPollen() {
        if (MODE === "legacy") return;
        fetchJson("/api/pollen", function (error, data) {
          var pollen = el("pollen");
          var active;
          var title = "";
          var i;
          if (!pollen) return;
          if (error || !data || data.error) {
            pollen.textContent = "-";
            pollen.title = "Kunne ikke hente pollenvarsel";
            return;
          }
          active = data.active && data.active.length ? data.active : [];
          pollen.textContent = data.summary || "Ingen";
          if (active.length) {
            for (i = 0; i < active.length; i += 1) {
              title += (i ? " · " : "") + active[i].name + ": " + active[i].levelText;
            }
          }
          pollen.title = title || "Ingen registrert pollenspredning i Rogaland i dag";
        });
      }

      function loadSunTimes() {
        if (MODE === "legacy") return;
        fetchJson("https://api.met.no/weatherapi/sunrise/3.0/sun?lat=" + encodeURIComponent(LAT) + "&lon=" + encodeURIComponent(LON) + "&date=" + encodeURIComponent(localDateKey(new Date())) + "&offset=+00:00", function (error, data) {
          var sunrise = read(data, ["location", "time", 0, "sunrise", "time"], null);
          var sunset = read(data, ["location", "time", 0, "sunset", "time"], null);
          var row = el("sunrow");
          if (error || !sunrise || !sunset) {
            if (row) row.style.display = "none";
            return;
          }
          setText("sunrise", formatTime(new Date(sunrise), false));
          setText("sunset", formatTime(new Date(sunset), false));
          if (row) row.style.display = "flex";
        });
      }

      function boot() {
        updateClock();
        loadWeather(function (error) {
          if (error) {
            setText("err", String(error && (error.stack || error.message) || error));
            return;
          }
          loadPollen();
          loadSunTimes();
        });
      }

      updateClock();
      boot();
      window.setInterval(updateClock, CLOCK_INTERVAL);
      window.setInterval(boot, WEATHER_INTERVAL);
    })();
  </script>
</body>
</html>
